<div [ngStyle]="{ backgroundColor: colorPickerBackground }"
    class="relative flex flex-row items-center justify-center w-full h-full overflow-hidden">
    <div class="absolute top-0 left-0 h-full w-full bg-cover bg-center z-0"
        [ngStyle]="{ 'background-image': 'url(' + imagePickerBackground + ')' }">
    </div>

    <div class="absolute top-5 left-5 bg-white p-2 rounded-md opacity-80 ">
        <p-colorpicker (onChange)="setBackgroundColor($event)" [ngModel]="colorPickerBackground" inputId="cp-hex" />
        <span class="ml-3">{{colorPickerBackground}}</span>
        @if(colorPickerBackground != '#1e2939'){
        <p-button (click)="resetBackgroundColor()" class="absolute top-[100%] left-0 scale-50 bg-white rounded-full"
            icon="pi pi-times" size="small" [rounded]="true" severity="danger" [outlined]="true"
            pTooltip="Resetear color" />
        }
        @if(imagePickerBackground){
        <p-button (click)="imagePickerBackground = undefined"
            class="absolute top-1/2 transform -translate-y-1/2 left-[100%] bg-white rounded-md ml-2" icon="pi pi-times"
            pTooltip="Eliminar imagen de fondo" />
        }@else{
        <p-button (click)="fileInput.click()"
            class="absolute top-1/2 transform -translate-y-1/2 left-[100%] bg-white rounded-md ml-2" icon="pi pi-image"
            pTooltip="Seleccionar imagen de fondo" />
        }
        <input type="file" accept="image/*" #fileInput hidden (change)="setBackgroundImage($event)">
    </div>

    <div id="container-model" class="w-1/2 h-full z-50">
        <div id="container3D" class="w-full h-full"></div>
    </div>
    <div id="preview" class="absolute bottom-0 right-0 w-[20vw] h-[20vw] grid grid-cols-2 bg-[#FFFFFF50]">
        <div class="relative">
            <div class="absolute bottom-1 left-1 text-sm text-gray-900 font-semibold">Isométrica</div>
            <canvas id="preview1" #preview1 class="w-full h-full border-b-2 border-[#00000025]"></canvas>
        </div>
        <div class="relative">
            <div class="absolute bottom-1 left-1 text-sm text-gray-900 font-semibold">Lateral</div>
            <canvas id="preview2" #preview2 class="w-full h-full border-l-2 border-b-2 border-[#00000025]"></canvas>
        </div>
        <div class="relative">
            <div class="absolute bottom-1 left-1 text-sm text-gray-900 font-semibold">Frontal</div>
            <canvas id="preview3" #preview3 class="w-full h-full"></canvas>
        </div>
        <div class="relative">
            <div class="absolute bottom-1 left-1 text-sm text-gray-900 font-semibold">Posterior</div>
            <canvas id="preview4" #preview4 class="w-full h-full border-l-2 border-[#00000025]"></canvas>
        </div>
    </div>
    @if (loader | async) {
    <div class="absolute w-full h-full flex items-center justify-center z-[100] bg-[#00000085]">
        <svg class="animate-spin h-6 w-6 text-gray-100" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" opacity="0.25" />
            <path fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
        </svg>
    </div>
    }
</div>
